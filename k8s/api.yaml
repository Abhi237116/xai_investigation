apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fci
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: fci-api:local
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: fci-config}
            - secretRef: {name: fci-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: fci
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
