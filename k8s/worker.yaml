apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-worker
  namespace: fci
spec:
  replicas: 1
  selector:
    matchLabels: {app: stream-worker}
  template:
    metadata:
      labels: {app: stream-worker}
    spec:
      containers:
        - name: worker
          image: fci-api:local
          command: ["python", "-m", "financial_crime.streaming.cli"]
          envFrom:
            - configMapRef: {name: fci-config}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
