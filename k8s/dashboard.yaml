apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: fci
spec:
  replicas: 1
  selector:
    matchLabels: {app: dashboard}
  template:
    metadata:
      labels: {app: dashboard}
    spec:
      containers:
        - name: dashboard
          image: fci-dashboard:local
          ports: [{containerPort: 5173}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: fci
spec:
  type: ClusterIP
  selector: {app: dashboard}
  ports: [{port: 5173, targetPort: 5173}]
